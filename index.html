<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1c" />
    <meta
      name="description"
      content="CHUNAV CHANAKYA — a turn-based meme election strategy game. Draft your campaigners, write a manifesto, and out-think two rival fronts across ten weeks."
    />
    <title>CHUNAV CHANAKYA — The Meme Election Strategy Game</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, #1b2350 0%, #080d1c 60%, #05081a 100%);
        font-family: 'Trebuchet MS', system-ui, -apple-system, sans-serif;
        color: #fff;
        overscroll-behavior: none;
      }
      #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
      #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      canvas#game {
        display: block;
        border-radius: 12px;
        box-shadow: 0 0 0 2px rgba(255, 153, 51, 0.5), 0 24px 70px rgba(0, 0, 0, 0.8);
        cursor: pointer;
        touch-action: manipulation;
      }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
        align-items: center; justify-content: center; background: #080d1c; z-index: 20;
        transition: opacity .5s ease; text-align: center; padding: 20px;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-size: clamp(26px, 6vw, 54px); letter-spacing: 2px; color: #ff9933; text-shadow: 0 4px 0 #000; }
      #boot p { margin: 0; opacity: .65; font-size: 14px; }
      .spin {
        width: 40px; height: 40px; border-radius: 50%;
        border: 5px solid rgba(255,255,255,.14); border-top-color: #ff9933; animation: sp .9s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
      #hintbar {
        position: fixed; left: 0; right: 0; bottom: 0; text-align: center; padding: 4px;
        font-size: 11px; color: rgba(255,255,255,.35); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage"><canvas id="game" width="1280" height="760" aria-label="Chunav Chanakya game board"></canvas></div>
    </div>
    <div id="hintbar">click to play · ENTER ends the week · ESC backs out · M mutes</div>
    <div id="boot">
      <h1>CHUNAV CHANAKYA</h1>
      <div class="spin"></div>
      <p>booking the helicopter&hellip;</p>
    </div>

    <!-- shared engine borrowed from arcade mode -->
    <script src="src/util.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/input.js"></script>
    <script src="src/fx.js"></script>
    <!-- the strategy game -->
    <script src="src/strat/data.js"></script>
    <script src="src/strat/model.js"></script>
    <script src="src/strat/ai.js"></script>
    <script src="src/strat/faces.js"></script>
    <script src="src/strat/ui.js"></script>
    <script src="src/strat/game.js"></script>
  </body>
</html>
